name: codestra-openbao

services:
  openbao:
    image: ghcr.io/openbao/openbao@sha256:e29524ba7c3f20d01f562c481e3eccbad6c91df45a2f2531433da4951e408cff
    platform: linux/amd64
    container_name: ${OPENBAO_CONTAINER_NAME:?set the reviewed container name}
    hostname: ${OPENBAO_NODE_ID:?set the reviewed node ID}
    user: openbao
    command:
      - server
      - -config=/openbao/config/openbao.hcl
    restart: unless-stopped
    stop_grace_period: 90s
    read_only: true
    init: false
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    environment:
      BAO_ADDR: https://127.0.0.1:8200
      BAO_CACERT: /run/secrets/codestra-client-ca
      BAO_CLIENT_CERT: /run/secrets/openbao-health-client-cert
      BAO_CLIENT_KEY: /run/secrets/openbao-health-client-key
    volumes:
      - ${OPENBAO_CONFIG_FILE:?set reviewed config path}:/openbao/config/openbao.hcl:ro
      - ${OPENBAO_DATA_DIR:?set existing or explicitly provisioned data directory}:/openbao/data
      - ${OPENBAO_AUDIT_DIR:?set protected audit directory}:/openbao/audit
      - ${OPENBAO_PLUGIN_DIR:?set exact release plugin directory}:/openbao/plugins:ro
      # Bind mounts preserve the reviewed host ownership and modes. Compose
      # file-backed secrets are intentionally not used because they are
      # mounted 0444 by implementations that cannot honor uid/gid/mode.
      - ${OPENBAO_SERVER_CERT_FILE:?set server certificate path}:/run/secrets/openbao-server-cert:ro
      - ${OPENBAO_SERVER_KEY_FILE:?set server private-key path}:/run/secrets/openbao-server-key:ro
      - ${CODESTRA_CLIENT_CA_FILE:?set client CA path}:/run/secrets/codestra-client-ca:ro
      - ${OPENBAO_HEALTH_CLIENT_CERT_FILE:?set health client certificate path}:/run/secrets/openbao-health-client-cert:ro
      - ${OPENBAO_HEALTH_CLIENT_KEY_FILE:?set health client private-key path}:/run/secrets/openbao-health-client-key:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
      - /openbao/logs:rw,noexec,nosuid,nodev,size=64m,mode=0750
    healthcheck:
      test: ["CMD", "bao", "status"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      client:
      cluster:
      observability:
    labels:
      com.codestra.component: openbao
      com.codestra.environment: ${CODESTRA_ENVIRONMENT:?set reviewed environment}
      com.codestra.source-sha: ${CODESTRA_SOURCE_SHA:?set exact protected source SHA}
      com.codestra.image-digest: sha256:e29524ba7c3f20d01f562c481e3eccbad6c91df45a2f2531433da4951e408cff
      com.codestra.owner: platform-security

networks:
  client:
    external: true
    name: ${OPENBAO_CLIENT_NETWORK:?set private client network}
  cluster:
    external: true
    name: ${OPENBAO_CLUSTER_NETWORK:?set private cluster network}
  observability:
    external: true
    name: ${OPENBAO_OBSERVABILITY_NETWORK:?set private observability network}
