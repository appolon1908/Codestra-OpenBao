name: codestra-openbao

services:
  openbao:
    image: ghcr.io/openbao/openbao@sha256:5b2486ab0fb90bbc788cc345b0a08616dfb375873ee8be5df3a2fd4d378a67e0
    platform: linux/amd64
    container_name: codestra-openbao
    command: ["server"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:18200:8200"
    volumes:
      - ../config/openbao.hcl:/openbao/config/openbao.hcl:ro
      - openbao_data:/openbao/data
      - openbao_audit:/openbao/audit
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=1777
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null 'http://127.0.0.1:8200/v1/sys/health?standbyok=true&perfstandbyok=true&sealedcode=200&uninitcode=200'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [openbao_private]

volumes:
  openbao_data:
  openbao_audit:

networks:
  openbao_private:
    driver: bridge
    internal: true
