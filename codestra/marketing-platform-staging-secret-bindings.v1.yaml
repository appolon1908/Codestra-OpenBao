schema_version: '1.0'
environment: staging
status: CONTRACT_DEFINED_NOT_APPLIED
secret_engine: kv-v2
paths:
  database:
    marketing: codestra/staging/database/marketing
    ai: codestra/staging/database/ai
    communication: codestra/staging/database/communication
    social: codestra/staging/database/social
    middleware: codestra/staging/database/middleware
    odoo: codestra/staging/database/odoo
  identity:
    keycloak_admin_apply: codestra/staging/keycloak/operator
    service_clients: codestra/staging/keycloak/service-clients
  gateway:
    kong_operator: codestra/staging/kong/operator
    upstream_service_auth: codestra/staging/kong/upstreams
  n8n:
    runtime: codestra/staging/n8n/runtime
    middleware_client: codestra/staging/n8n/middleware-client
  providers:
    meta_read_only: codestra/staging/providers/meta/read-only
    social_runtime_read_only: codestra/staging/providers/social-runtime/read-only
  observability:
    otel: codestra/staging/observability/otel
    grafana: codestra/staging/observability/grafana
    prometheus: codestra/staging/observability/prometheus
policy:
  environment_isolation: true
  least_privilege: true
  git_secret_material_allowed: false
  workflow_json_secret_material_allowed: false
  production_provider_write_credentials_allowed: false
  dynamic_or_short_lived_credentials_preferred: true
required_evidence:
  - secret paths exist without exposing values
  - each workload can read only its assigned paths
  - cross-environment reads are denied
  - n8n cannot read Meta or Google provider write credentials
  - AI cannot read advertising approval/write credentials
  - read-only canary credentials cannot mutate provider state
