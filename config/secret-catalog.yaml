version: 1
mount: codestra
type: kv-v2
environments:
  - staging
  - production

rules:
  frontends_may_read_openbao: false
  cross_environment_access: false
  wildcard_cross_product_reader: false
  production_trading_requires_separate_cutover: true

services:
  shared-saas:
    consumers: [shared-saas-backend]
    groups: [identity, billing, google-login, gmail, social, webhooks, developer-credentials, storage, notifications]
  beyvra:
    consumers: [beyvra-backend, beyvra-execution]
    groups: [market-data, broker, exchange, custody, funding, kyc, webhooks, signing]
  moneybee:
    consumers: [Moneybee-Backend]
    groups: [financial-data, kyc, lenders, esign, payments, webhooks]
  transportation:
    consumers: [transportation-backend]
    groups: [carrier-verification, tracking, maps, payments, webhooks]
  larim-a:
    consumers: [LARIM-A-Backend]
    groups: [maps, payments, provider-verification, notifications, webhooks]
  breero:
    consumers: [Breero-backend]
    groups: [maps, payments, technician-verification, notifications, webhooks]
  booked4seasons:
    consumers: [booked4seasons-backend]
    groups: [lead-delivery, captcha, analytics]
  restaurant:
    consumers: [restaurant-backend]
    groups: [payments, notifications, delivery, webhooks]
  klyrow:
    consumers: [klyrow-backend]
    groups: [smtp, postal, mautic, domain-signing, webhooks]
  telnexa:
    consumers: [telnexa-backend]
    groups: [jasmin, providers, sender-registration, webhooks]
  vicidial:
    consumers: [vicidial-adapter]
    groups: [didww, twilio, ami, webhooks]
  social-codestra:
    consumers: [social-backend]
    groups: [postiz, postly, oauth, webhooks]
  keycloak:
    consumers: [keycloak]
    groups: [database, smtp, identity-providers, signing]
  kong:
    consumers: [kong]
    groups: [database, oidc, plugins, upstream-mtls]
  middleware:
    consumers: [middleware]
    groups: [database, redis, webhooks, integration-signing, adapters]
  n8n:
    consumers: [n8n]
    groups: [database, encryption, approved-integrations]
  odoo:
    consumers: [odoo]
    groups: [database, smtp, integrations]

frontend_repositories:
  - beyvra-frontend
  - Moneybee-frontend-
  - transportaion-Frontend
  - LARIM-A-Fornt-end
  - booked4seasons
  - Frontend-Resturant-
  - klyrow-Website-
  - Telnexa-web

api_secret_owners:
  authentication_sso: shared-saas/keycloak
  billing_subscriptions: shared-saas/billing
  email_transactional_marketing: klyrow
  sms: telnexa
  social_publishing: social-codestra
  voice: vicidial
  trading_market_data_execution: beyvra
  business_funding: moneybee
  freight: transportation
  larimia_marketplace: larim-a
  breero_marketplace: breero
  restaurant: restaurant
