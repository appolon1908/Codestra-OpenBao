name: Inspect upstream source identity

on:
  push:
    branches: [main]
    paths:
      - CODESTRA_UPSTREAM.json
      - scripts/inspect_upstream_source.py
      - .github/workflows/upstream-source-sync.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPECTED_SHA: ${{ github.sha }}

jobs:
  inspect:
    name: OpenBao upstream / identity inspection
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
      - name: Inspect declared upstream without importing or updating refs
        env:
          REPORT_PATH: ${{ runner.temp }}/openbao-upstream-identity.json
        run: python3 scripts/inspect_upstream_source.py --output "$REPORT_PATH"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: upstream-identity-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/openbao-upstream-identity.json
          if-no-files-found: error
          retention-days: 14
