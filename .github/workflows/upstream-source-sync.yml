name: Codestra OpenBao Upstream Source Sync

on:
  push:
    branches: [main]
    paths:
      - CODESTRA_UPSTREAM.json
      - .github/workflows/upstream-source-sync.yml
      - scripts/prepare_upstream_import.py
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: codestra-openbao-upstream-source-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.actor != 'github-actions[bot]' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out exact Codestra authority
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Import exact reviewed upstream source
        shell: bash
        run: |
          set -Eeuo pipefail

          mapfile -t values < <(python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("CODESTRA_UPSTREAM.json").read_text(encoding="utf-8"))
          print(data["upstream_clone_url"])
          print(data["upstream_ref"])
          print(data["import_path"])
          print(str(data["deployment_enabled"]).lower())
          print(str(data["secret_material_allowed_in_git"]).lower())
          PY
          )

          UPSTREAM_URL="${values[0]}"
          UPSTREAM_REF="${values[1]}"
          IMPORT_PATH="${values[2]}"
          DEPLOYMENT_ENABLED="${values[3]}"
          SECRET_MATERIAL_ALLOWED="${values[4]}"

          [[ "$UPSTREAM_URL" == "https://github.com/openbao/openbao.git" ]]
          [[ "$UPSTREAM_REF" == "main" ]]
          [[ "$IMPORT_PATH" == "upstream" ]]
          [[ "$DEPLOYMENT_ENABLED" == "false" ]]
          [[ "$SECRET_MATERIAL_ALLOWED" == "false" ]]

          SOURCE_DIR="$RUNNER_TEMP/openbao-upstream-source"
          INDEX_FILE="$RUNNER_TEMP/openbao-upstream-index.z"
          PATHSPEC_FILE="$RUNNER_TEMP/openbao-upstream-pathspecs.z"
          rm -rf "$SOURCE_DIR"
          GIT_LFS_SKIP_SMUDGE=1 git clone \
            --depth 1 \
            --branch "$UPSTREAM_REF" \
            "$UPSTREAM_URL" \
            "$SOURCE_DIR"

          UPSTREAM_SHA="$(git -C "$SOURCE_DIR" rev-parse HEAD)"
          [[ "$UPSTREAM_SHA" =~ ^[0-9a-f]{40}$ ]]
          git -C "$SOURCE_DIR" ls-files --stage -z > "$INDEX_FILE"

          SYNC_BRANCH="automation/openbao-upstream-${UPSTREAM_SHA:0:12}"
          git switch -C "$SYNC_BRANCH"
          rm -rf "$IMPORT_PATH"
          mkdir -p "$IMPORT_PATH"
          git -C "$SOURCE_DIR" archive --format=tar "$UPSTREAM_SHA" \
            | tar --extract --file=- --directory="$IMPORT_PATH" \
                --no-same-owner --no-same-permissions

          python3 - <<'PY'
          from pathlib import Path

          importer = Path("scripts/prepare_upstream_import.py").read_text(
              encoding="utf-8"
          )
          required = (
              "original_block_sha256",
              "PRIVATE_KEY_BLOCK",
              "_replace_whole_file",
              "_is_secret_directory_path",
          )
          missing = [marker for marker in required if marker not in importer]
          if missing:
              raise SystemExit(
                  f"upstream importer provenance/sanitization controls missing: {missing}"
              )
          print("PRIVATE_KEY_TEST_FIXTURE_REMOVED=ENFORCED_BY_IMPORTER")
          PY

          python3 scripts/prepare_upstream_import.py \
            --repo-root . \
            --root "$IMPORT_PATH" \
            --stage-index "$INDEX_FILE" \
            --upstream-url "$UPSTREAM_URL" \
            --upstream-ref "$UPSTREAM_REF" \
            --upstream-sha "$UPSTREAM_SHA" \
            --manifest CODESTRA_UPSTREAM_SANITIZATION.json \
            --lock CODESTRA_UPSTREAM_LOCK.json \
            --pathspec-output "$PATHSPEC_FILE"

          bash scripts/reject_repository_secrets.sh "$IMPORT_PATH"

          git config user.name "codestra-upstream-sync"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage removals from the previous snapshot, then force-add only the exact
          # reviewed paths emitted after fail-closed ignore and secret validation.
          git add -u -- "$IMPORT_PATH"
          GIT_LITERAL_PATHSPECS=1 git add -f \
            --pathspec-from-file="$PATHSPEC_FILE" \
            --pathspec-file-nul
          git add -A -- \
            CODESTRA_UPSTREAM_LOCK.json \
            CODESTRA_UPSTREAM_SANITIZATION.json

          python3 - <<'PY'
          import subprocess

          allowed_exact = {
              "CODESTRA_UPSTREAM_LOCK.json",
              "CODESTRA_UPSTREAM_SANITIZATION.json",
          }
          changed = subprocess.check_output(
              ["git", "diff", "--cached", "--name-only", "-z"]
          ).split(b"\0")
          bad = []
          for raw in changed:
              if not raw:
                  continue
              path = raw.decode("utf-8")
              if path not in allowed_exact and not path.startswith("upstream/"):
                  bad.append(path)
          if bad:
              raise SystemExit(f"staged path escaped source-sync boundary: {bad}")
          PY

          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No upstream source drift to publish."
            exit 0
          fi

          git commit -m "vendor: sync sanitized official OpenBao upstream ${UPSTREAM_SHA}"
          git fetch origin \
            "refs/heads/${SYNC_BRANCH}:refs/remotes/origin/${SYNC_BRANCH}" \
            || true
          git push --force-with-lease origin "HEAD:refs/heads/${SYNC_BRANCH}"
          echo "SYNC_BRANCH=${SYNC_BRANCH}" >> "$GITHUB_ENV"
          echo "UPSTREAM_SHA=${UPSTREAM_SHA}" >> "$GITHUB_ENV"

      - name: Open reviewable upstream-source pull request
        if: env.SYNC_BRANCH != ''
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if gh pr list \
            --base development \
            --head "$SYNC_BRANCH" \
            --state open \
            --json number \
            --jq 'length' \
            | grep -qx '0'
          then
            gh pr create \
              --base development \
              --head "$SYNC_BRANCH" \
              --title "vendor(openbao): sync sanitized upstream ${UPSTREAM_SHA:0:12}" \
              --body "Official OpenBao source snapshot locked to \`${UPSTREAM_SHA}\`. The workflow proves every extracted path and Git blob against the reviewed upstream index, rejects untracked or unsafe ignored paths, replaces admitted secret-bearing fixtures with deterministic invalid placeholders, and force-adds only the emitted literal path list. This pull request does not deploy or activate OpenBao."
          fi
