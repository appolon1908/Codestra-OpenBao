name: Secret authority policy

on:
  pull_request:
    paths:
      - 'config/**'
      - 'docs/**'
      - 'scripts/**'
      - '.github/workflows/secret-authority-policy.yml'
  push:
    branches: [main]
    paths:
      - 'config/**'
      - 'docs/**'
      - 'scripts/**'
      - '.github/workflows/secret-authority-policy.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate bootstrap shell
        run: bash -n scripts/bootstrap-codestra-secret-authority.sh

      - name: Reject tracked secret-material extensions
        shell: bash
        run: |
          set -euo pipefail
          bad="$(git ls-files | grep -E '\.(pem|key|p12|pfx|jks|keystore|unseal|token|secret)$' || true)"
          if [[ -n "$bad" ]]; then
            echo "Tracked secret-like files are forbidden:"
            printf '%s\n' "$bad"
            exit 1
          fi

      - name: Require frontend isolation rule
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'frontends_may_read_openbao: false' config/secret-catalog.yaml
          grep -q 'wildcard_cross_product_reader: false' config/secret-catalog.yaml
          grep -q 'cross_environment_access: false' config/secret-catalog.yaml

      - name: Require production trading separation
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'production_trading_requires_separate_cutover: true' config/secret-catalog.yaml
          grep -q 'beyvra-execution' config/secret-catalog.yaml
          grep -q 'beyvra-execution-read' scripts/bootstrap-codestra-secret-authority.sh
