name: OpenBao protected runtime rollback

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Exact protected environment
        required: true
        type: choice
        options: [development, test, staging, production]
      current_source_sha:
        description: Exact current protected environment SHA
        required: true
        type: string
      rollback_container:
        description: Exact retained timestamped rollback container name
        required: true
        type: string
      rollback_source_sha:
        description: Exact retained container source SHA
        required: true
        type: string
      rollback_image_digest:
        description: Exact retained container sha256 image digest
        required: true
        type: string
      confirmation:
        description: ROLLBACK_OPENBAO_RUNTIME_TO_<rollback source SHA>
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: openbao-${{ inputs.environment }}-mutation
  cancel-in-progress: false

jobs:
  rollback:
    name: Restore exact retained OpenBao runtime
    environment: openbao-${{ inputs.environment }}-runtime
    runs-on: [self-hosted, linux, x64, codestra-openbao]
    timeout-minutes: 60
    env:
      CODESTRA_ENVIRONMENT: ${{ inputs.environment }}
      OPENBAO_CHANGE_KERNEL_DATABASE_URL: ${{ vars.OPENBAO_CHANGE_KERNEL_DATABASE_URL }}
      CODESTRA_SOURCE_SHA: ${{ inputs.current_source_sha }}
      OPENBAO_APPROVAL_ENVIRONMENT: openbao-${{ inputs.environment }}-runtime
      OPENBAO_CONTAINER_NAME: ${{ vars.OPENBAO_CONTAINER_NAME }}
      OPENBAO_ROLLBACK_CONTAINER: ${{ inputs.rollback_container }}
      OPENBAO_ROLLBACK_SOURCE_SHA: ${{ inputs.rollback_source_sha }}
      OPENBAO_ROLLBACK_IMAGE_DIGEST: ${{ inputs.rollback_image_digest }}
      OPENBAO_ROLLBACK_CONFIRMATION: ${{ inputs.confirmation }}
      BAO_ADDR: ${{ vars.OPENBAO_ADDR }}
      BAO_CACERT: ${{ vars.OPENBAO_CA_CERT_PATH }}
      BAO_CLIENT_CERT: ${{ vars.OPENBAO_OPERATOR_CERT_PATH }}
      BAO_CLIENT_KEY: ${{ vars.OPENBAO_OPERATOR_KEY_PATH }}
      OPENBAO_OPERATOR_TOKEN_FILE: ${{ vars.OPENBAO_OPERATOR_TOKEN_FILE }}
      OPENBAO_BACKUP_ROOT: ${{ vars.OPENBAO_BACKUP_ROOT }}
      OPENBAO_AGE_RECIPIENT_FILE: ${{ vars.OPENBAO_AGE_RECIPIENT_FILE }}
      OPENBAO_AGE_IDENTITY_FILE: ${{ vars.OPENBAO_AGE_IDENTITY_FILE }}
      OPENBAO_OFFHOST_REMOTE: ${{ vars.OPENBAO_OFFHOST_REMOTE }}
      OPENBAO_OFFHOST_IMMUTABILITY_ATTESTATION: ${{ vars.OPENBAO_OFFHOST_IMMUTABILITY_ATTESTATION }}
    steps:
      - name: Check out exact current protected source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.current_source_sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Acquire the cluster mutation lease
        run: |
          [[ -n "$OPENBAO_CHANGE_KERNEL_DATABASE_URL" ]]
          lease_file="$RUNNER_TEMP/openbao-mutation-lease.json"
          printf 'OPENBAO_CHANGE_KERNEL_LEASE_FILE=%s\n' "$lease_file" >> "$GITHUB_ENV"
          python3 -m codestra.change_kernel.cli lock-acquire --environment "$CODESTRA_ENVIRONMENT" \
            --holder "github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}" --purpose runtime-rollback \
            --run-ref "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --ttl 3600 --lease-file "$lease_file"
      - name: Bind reviewed rollback authorization and take fresh backup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export OPENBAO_ROLLBACK_EVIDENCE="$RUNNER_TEMP/openbao-rollback-evidence/rollback.json"
          export OPENBAO_PRECHANGE_BACKUP_EVIDENCE="$RUNNER_TEMP/openbao-rollback-evidence/prechange-backup.json"
          export OPENBAO_ROLLBACK_AUTHORIZATION_EVIDENCE="$RUNNER_TEMP/openbao-rollback-evidence/rollback-authorization.json"
          printf 'OPENBAO_ROLLBACK_EVIDENCE=%s\n' "$OPENBAO_ROLLBACK_EVIDENCE" >> "$GITHUB_ENV"
          printf 'OPENBAO_PRECHANGE_BACKUP_EVIDENCE=%s\n' "$OPENBAO_PRECHANGE_BACKUP_EVIDENCE" >> "$GITHUB_ENV"
          printf 'OPENBAO_ROLLBACK_AUTHORIZATION_EVIDENCE=%s\n' "$OPENBAO_ROLLBACK_AUTHORIZATION_EVIDENCE" >> "$GITHUB_ENV"
          [[ "$(git rev-parse HEAD)" == "$CODESTRA_SOURCE_SHA" ]]
          [[ "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${CODESTRA_ENVIRONMENT}" --jq .object.sha)" == "$CODESTRA_SOURCE_SHA" ]]
          scripts/verify_environment_approval.sh
          umask 077
          mkdir -p "$(dirname "$OPENBAO_ROLLBACK_EVIDENCE")"
          export BAO_TOKEN="$(< "$OPENBAO_OPERATOR_TOKEN_FILE")"
          export OPENBAO_BACKUP_EVIDENCE="$OPENBAO_PRECHANGE_BACKUP_EVIDENCE"
          scripts/backup.sh
          unset BAO_TOKEN
          backup_evidence_sha="$(sha256sum "$OPENBAO_PRECHANGE_BACKUP_EVIDENCE" | awk '{print $1}')"
          backup_artifact_sha="$(jq -r '.sha256' "$OPENBAO_PRECHANGE_BACKUP_EVIDENCE")"
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" --arg workflow "$GITHUB_WORKFLOW" \
            --arg runId "$GITHUB_RUN_ID" --arg environment "$CODESTRA_ENVIRONMENT" \
            --arg approvalEnvironment "$OPENBAO_APPROVAL_ENVIRONMENT" \
            --arg approvedBy "${OPENBAO_REQUIRED_REVIEWER:-kazan555}" \
            --arg currentSourceSha "$CODESTRA_SOURCE_SHA" \
            --arg rollbackSourceSha "$OPENBAO_ROLLBACK_SOURCE_SHA" \
            --arg rollbackImageDigest "$OPENBAO_ROLLBACK_IMAGE_DIGEST" \
            --arg rollbackContainer "$OPENBAO_ROLLBACK_CONTAINER" \
            --arg confirmation "$OPENBAO_ROLLBACK_CONFIRMATION" \
            --arg backupEvidenceSha256 "$backup_evidence_sha" \
            --arg backupArtifactSha256 "$backup_artifact_sha" \
            --arg createdAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{schemaVersion:1,repository:$repository,workflow:$workflow,runId:$runId,environment:$environment,approvalEnvironment:$approvalEnvironment,approvedBy:$approvedBy,currentSourceSha:$currentSourceSha,rollbackSourceSha:$rollbackSourceSha,rollbackImageDigest:$rollbackImageDigest,rollbackContainer:$rollbackContainer,confirmation:$confirmation,backupEvidenceSha256:$backupEvidenceSha256,backupArtifactSha256:$backupArtifactSha256,createdAt:$createdAt,authorization:"PASS",secretValuesIncluded:false}' \
            > "$OPENBAO_ROLLBACK_AUTHORIZATION_EVIDENCE"
          chmod 0400 "$OPENBAO_ROLLBACK_AUTHORIZATION_EVIDENCE"
          python3 scripts/verify_rollback_preconditions.py \
            "$OPENBAO_ROLLBACK_AUTHORIZATION_EVIDENCE" "$OPENBAO_PRECHANGE_BACKUP_EVIDENCE"
      - name: Roll back to retained exact container without changing Raft data
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/rollback.sh
      - name: Upload sanitized rollback and SSH evidence only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: openbao-rollback-${{ inputs.environment }}-${{ inputs.rollback_source_sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/openbao-rollback-evidence/
          if-no-files-found: error
          retention-days: 90
      - name: Release the cluster mutation lease
        if: always()
        run: |
          if [[ -f "${OPENBAO_CHANGE_KERNEL_LEASE_FILE:-}" ]]; then
            python3 -m codestra.change_kernel.cli lock-release --lease-file "$OPENBAO_CHANGE_KERNEL_LEASE_FILE"
          fi
