name: Validate Codestra service API contract

on:
  pull_request:
    paths:
      - 'codestra/api/service-contract.v1.json'
      - 'docs/CODESTRA-SERVICE-API.md'
      - '.github/workflows/validate-codestra-service-contract.yml'
  push:
    branches: [development, test, staging, production, main, 'remediation/**', 'sync/upstream/**']
    paths:
      - 'codestra/api/service-contract.v1.json'
      - 'docs/CODESTRA-SERVICE-API.md'
      - '.github/workflows/validate-codestra-service-contract.yml'

permissions:
  contents: read

concurrency:
  group: codestra-service-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canonical-contract-authority:
    uses: ingtrader21-spec/Codestra-Telemetry/.github/workflows/reusable-validate-service-contract.yml@3517fb3b9bb1077d92419a5c13c07d703ffbebf6
    with:
      expected_repository: 'ingtrader21-spec/Codestra-OpenBao'
      expected_component: 'openbao'
      expected_contract_id: 'codestra.observability.openbao.v1'
      schema_authority_revision: '3517fb3b9bb1077d92419a5c13c07d703ffbebf6'

  validate-service-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact source head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'

      - name: Validate canonical OpenBao service API contract
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          contract_path = Path('codestra/api/service-contract.v1.json')
          contract = json.loads(contract_path.read_text(encoding='utf-8'))

          assert contract['schemaVersion'] == '1.0.0'
          assert contract['component'] == 'openbao'
          assert contract['contractId'] == 'codestra.observability.openbao.v1'
          assert contract['repository'] == 'ingtrader21-spec/Codestra-OpenBao'
          assert contract['authorityRole'] == 'secrets-pki-workload-identity-authority'
          assert contract['canonicalHostname'] == 'bao.codestra.media'
          assert contract['nativeExposure'] == 'private_strong_auth'
          assert contract['schemaAuthority'] == {
              'repository': 'ingtrader21-spec/Codestra-Telemetry',
              'path': 'codestra/api/service-contract.schema.json',
              'sourceRevision': '3517fb3b9bb1077d92419a5c13c07d703ffbebf6',
              'version': '1.0.0',
          }

          native_api = contract['nativeApi']
          assert re.fullmatch(r'CODESTRA_[A-Z0-9_]+', native_api['baseUrlEnvironment'])
          authentication = native_api['authentication']
          assert authentication == {
              'callerControlledBusinessAllowed': False,
              'credentialSource': 'secret_file',
              'requiredScopes': [],
              'tenantHeader': None,
              'transport': 'private_mtls',
          }

          operations = {item['id']: item for item in native_api['operations']}
          assert len(operations) == len(native_api['operations'])
          for operation in operations.values():
              path = operation['path']
              assert isinstance(path, str) and path.startswith('/') and not path.startswith('//')
              assert '\r' not in path and '\n' not in path
              assert operation['controlPlaneProxyAllowed'] is False
              assert 250 <= operation['timeoutMs'] <= 10000
              assert operation['acceptedStatuses']

          management = contract['managementReadback']
          assert management['controlApiOwner'] == 'ingtrader21-spec/Codestra-Telemetry'
          assert management['registryServiceId'] == 'openbao'
          assert management['responseBodyPolicy'] == 'discard'
          assert management['exposesSecretValues'] is False
          assert management['allowsMutation'] is False
          for key in ('healthOperationId', 'readinessOperationId'):
              operation = operations[management[key]]
              assert operation['method'] in {'GET', 'HEAD'}
              assert operation['access'] == 'read_only'
              assert operation['responseBodyPolicy'] == 'discard'

          health = operations['health']
          readiness = operations['readiness']
          assert health['path'] == '/v1/sys/health'
          assert readiness['path'] == '/v1/sys/health'
          assert health['acceptedStatuses'] == [200, 429, 472, 473]
          assert readiness['acceptedStatuses'] == [200, 429, 472, 473]
          required_native = {
              'workload-login': ('POST', '/v1/auth/jwt-codestra/login', 'mutation'),
              'secret-read': ('GET', '/v1/codestra/data/{environment}/{namespace}/{secret-name}', 'query'),
              'secret-metadata': ('GET', '/v1/codestra/metadata/{environment}/{namespace}/{secret-name}', 'query'),
              'secret-write': ('POST', '/v1/codestra/data/{environment}/{namespace}/{secret-name}', 'mutation'),
              'token-renew-self': ('POST', '/v1/auth/token/renew-self', 'mutation'),
              'token-revoke-self': ('POST', '/v1/auth/token/revoke-self', 'mutation'),
              'pki-issue': ('POST', '/v1/{mount}/issue/{role}', 'mutation'),
          }
          for operation_id, (method, path, access) in required_native.items():
              operation = operations[operation_id]
              assert operation['method'] == method
              assert operation['path'] == path
              assert operation['access'] == access
              assert operation['controlPlaneProxyAllowed'] is False
          assert operations['token-revoke-self']['responseBodyPolicy'] == 'discard'

          assert all(item['mutating'] is False for item in contract['integrations'])
          assert contract['release']['immutableImageRequired'] is True
          assert re.fullmatch(r'CODESTRA_[A-Z0-9_]+', contract['release']['sourceRevisionEnvironment'])
          assert re.fullmatch(r'CODESTRA_[A-Z0-9_]+', contract['release']['imageDigestEnvironment'])
          assert contract['correlation']['indexedFields'] == [
              'codestra_business', 'application', 'service', 'environment', 'server', 'region', 'deployment'
          ]
          assert {'request_id', 'trace_id', 'tenant_id'} <= set(contract['correlation']['protectedNonIndexedFields'])
          assert all(value is False for value in contract['safety'].values())

          serialized = json.dumps(contract, sort_keys=True)
          assert 'BEGIN ' + 'PRIVATE KEY' not in serialized
          assert not re.search(r'AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{20,}', serialized)
          PY

      - name: Confirm documentation and secret-safe contract source
        run: |
          test -s docs/CODESTRA-SERVICE-API.md
          ! grep -RInE --exclude='*.md' '(BEGIN (RSA |EC |DSA |OPENSSH )?PRIVATE KEY|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{20,})' codestra/api
