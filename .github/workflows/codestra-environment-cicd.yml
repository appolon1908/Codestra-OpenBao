name: Codestra Environment CI/CD

on:
  push:
    branches: [development, testing, staging, production]
  pull_request:
    branches: [development, testing, staging, production]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codestra-env-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  ci:
    name: Validate source and environment contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Git whitespace validation
        run: git diff --check

      - name: Validate JSON and Python syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import pathlib
          import py_compile

          root = pathlib.Path(".")
          # Exactly two inherited TypeScript tsconfig JSONC files are exempt
          # from strict JSON parsing. All other repository JSON stays strict.
          jsonc_paths = {
              pathlib.Path("upstream/ui/tsconfig.json"),
              pathlib.Path("upstream/website/tsconfig.json"),
          }
          assert all(path.is_file() for path in jsonc_paths), "reviewed upstream JSONC paths missing"
          for path in root.rglob("*.json"):
              if any(part in {".git", "node_modules", ".venv", "vendor"} for part in path.parts):
                  continue
              if path in jsonc_paths:
                  print(f"JSONC_SOURCE_DELEGATED={path}")
                  continue
              try:
                  with path.open("r", encoding="utf-8") as handle:
                      json.load(handle)
              except (json.JSONDecodeError, UnicodeError) as exc:
                  raise SystemExit(f"JSON_VALIDATION_FAIL={path}: {exc}") from exc

          for path in root.rglob("*.py"):
              if any(part in {".git", "node_modules", ".venv", "vendor"} for part in path.parts):
                  continue
              py_compile.compile(str(path), doraise=True)
          PY

      - name: Record immutable candidate
        shell: bash
        run: |
          mkdir -p .codestra-ci
          printf 'repository=%s\nref=%s\nsha=%s\nevent=%s\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "$GITHUB_SHA" "$GITHUB_EVENT_NAME" \
            > .codestra-ci/candidate.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codestra-candidate-${{ github.sha }}
          path: .codestra-ci/candidate.txt
          retention-days: 14

  deploy:
    name: Gated middleware-host deployment
    needs: ci
    if: github.event_name == 'push' && vars.CODESTRA_DEPLOY_ENABLED == 'true'
    runs-on: [self-hosted, linux, x64, codestra-middleware]
    environment: ${{ github.ref_name }}
    steps:
      - name: Deploy exact certified SHA
        shell: bash
        run: |
          set -euo pipefail
          /usr/local/sbin/codestra-deploy-from-worktree \
            "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "$GITHUB_SHA"
