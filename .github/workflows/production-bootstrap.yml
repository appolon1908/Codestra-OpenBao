name: production-bootstrap
on:
  pull_request:
    paths:
      - "deploy/**"
      - "config/**"
      - "scripts/**"
      - "policies/**"
      - "contracts/**"
      - "tests/**"
      - ".github/workflows/production-bootstrap.yml"
  push:
    branches: [development, test, staging, production, main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Validate Compose
        run: docker compose -f deploy/compose.yaml config >/dev/null
      - name: Validate scripts
        run: |
          shellcheck scripts/*.sh tests/*.sh
          sh tests/static.sh
