name: Validate Codestra production server API contract

on:
  pull_request:
    paths:
      - docs/CODESTRA_PRODUCTION_SERVER_API_CONTRACT.md
      - .github/workflows/validate-production-server-api-contract.yml
  push:
    branches: [development, test, staging, production, main]
    paths:
      - docs/CODESTRA_PRODUCTION_SERVER_API_CONTRACT.md
      - .github/workflows/validate-production-server-api-contract.yml

permissions:
  contents: read

concurrency:
  group: openbao-production-api-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up pinned Python toolchain
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Validate source-only production contract
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('docs/CODESTRA_PRODUCTION_SERVER_API_CONTRACT.md').read_text(encoding='utf-8')
          required = [
              'appolon1908-hue/Codestra-OpenBao',
              '37.27.128.39',
              'SOURCE_CONTRACT_PREPARED_NOT_DEPLOYED',
              'CVE-2026-84304',
              'GRPC_GO_VERSION>=1.83.1',
              'OPENBAO_RUNTIME_ACTIVATION=BLOCKED',
              'OPENBAO_PRODUCTION_DEPLOYMENT=NO',
              'GET` | `/v1/sys/health',
              'GET` | `/v1/sys/seal-status',
              'TLS 1.3',
              'PKCE S256',
              'CROSS_BUSINESS_DENIAL=PASS',
              'SECRET_VALUES_IN_EVIDENCE=0',
              'RAFT_SNAPSHOT=PASS',
              'ISOLATED_RESTORE=PASS',
              'UNEXPECTED_404=0',
              'SOURCE_RUNTIME_DRIFT=0',
              'This document does not initialize, unseal, deploy',
          ]
          missing = [value for value in required if value not in text]
          assert not missing, f'missing production API contract controls: {missing}'
          forbidden = [
              'ADMIN_BYPASS_AUTHORIZED=YES',
              'SSH_CONFIGURATION_CHANGES_AUTHORIZED=YES',
              ':latest',
              'OPENBAO_RUNTIME_ACTIVATION=PASS',
              'OPENBAO_PRODUCTION_DEPLOYMENT=YES',
          ]
          present = [value for value in forbidden if value in text]
          assert not present, f'forbidden production contract claims: {present}'
          print('CODESTRA_OPENBAO_PRODUCTION_API_CONTRACT=PASS')
          PY
