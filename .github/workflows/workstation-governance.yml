name: Workstation governance
on:
  pull_request_target:

permissions:
  contents: read

jobs:
  promotion-gate:
    name: promotion-gate
    runs-on: ubuntu-latest
    steps:
      - name: Validate promotion hierarchy from trusted base
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.event.pull_request.base.repo.full_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ "$HEAD_REF" = "governance/agent-hierarchy-main-v1" ] && [ "$BASE_REF" = "main" ] && [ "$HEAD_REPO" = "$BASE_REPO" ]; then
            echo "PROMOTION_ALLOWED=YES governance_main_bootstrap"
            exit 0
          fi

          if [ "$HEAD_REF" = "governance/agent-hierarchy-v1" ] && [ "$BASE_REF" = "development" ] && [ "$HEAD_REPO" = "$BASE_REPO" ]; then
            echo "PROMOTION_ALLOWED=YES governance_development_bootstrap"
            exit 0
          fi

          if [ "$HEAD_REPO" != "$BASE_REPO" ]; then
            echo "PROMOTION_ALLOWED=NO fork_source_not_allowed"
            exit 1
          fi

          mkdir -p trusted-base
          gh api             -H "Accept: application/vnd.github.raw+json"             "/repos/$REPOSITORY/contents/.codestra/validate-promotion.py?ref=$BASE_SHA"             > trusted-base/validate-promotion.py

          python3 trusted-base/validate-promotion.py "$HEAD_REF" "$BASE_REF"
