name: Controlled intake staging activation preparation gate

on:
  pull_request:
    paths:
      - "integration/staging-activation-contract-v1.json"
      - ".github/workflows/controlled-intake-staging-activation-gate.yml"
  workflow_dispatch:
    inputs:
      execution_reason:
        description: "Why is this integration being executed?"
        required: true
        type: string
      change_id:
        description: "Approved staging certification identifier"
        required: true
        type: string
      expected_branch_head:
        description: "Exact 40-character branch SHA being certified"
        required: true
        type: string
      middleware_image_digest:
        description: "Verified immutable Middleware digest"
        required: true
        type: string
      staging_evidence_checksum:
        description: "Passing runtime evidence checksum"
        required: true
        type: string
      staging_evidence_run_id:
        description: "Successful Prometheus collector run containing the evidence artifact"
        required: true
        type: string
      staging_evidence_artifact_name:
        description: "Exact unexpired Prometheus collector artifact name"
        required: true
        type: string
      confirm_prometheus_only:
        description: "Only the approved Prometheus target may later become active"
        required: true
        type: boolean
      confirm_blackbox_pending:
        description: "Blackbox remains pending"
        required: true
        type: boolean
      confirm_no_external_effects:
        description: "No external effect or production mutation is authorized"
        required: true
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: controlled-intake-staging-activation-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-preparation-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate signed immutable Middleware release lock
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          data = json.loads(Path("integration/staging-activation-contract-v1.json").read_text())
          assert data["schema_version"] == "1.1"
          assert data["suite_id"] == "codestra-controlled-intake-monitoring-v1"
          assert data["repository"] == os.environ["GITHUB_REPOSITORY"]
          assert data["execution_question"] == "Why is this integration being executed?"
          assert data["execution_reason_required"] is True and data["source_only_preparation"] is True
          source = data["middleware_source_authority"]
          expected = {
              "repository": "appolon1908-hue/Middleware-",
              "source_sha": "f6748a58f8d2590520a4f28776770957061cdea1",
              "source_state": "MERGED_REVIEWED_EXACT_SHA",
              "immutable_image_reference": "ghcr.io/appolon1908-hue/codestra-middleware@sha256:695fa3ce3f50ba4d0ae0784976b946a0a683ca731155e4bd3bd9e90a4670b820",
              "immutable_image_digest": "sha256:695fa3ce3f50ba4d0ae0784976b946a0a683ca731155e4bd3bd9e90a4670b820",
              "image_digest_state": "VERIFIED_SIGNED_IMMUTABLE_IMAGE_AVAILABLE",
              "release_id": "f6748a58f8d2-695fa3ce3f50",
              "release_run_id": 33314094004,
              "release_run_attempt": 1,
              "release_run_url": "https://github.com/appolon1908-hue/Middleware-/actions/runs/33314094004",
              "release_artifact_name": "signed-middleware-release-f6748a58f8d2590520a4f28776770957061cdea1-33314094004-1",
              "release_built_at": "2026-08-30T13:24:37Z",
              "release_workflow_path": ".github/workflows/release.yml",
              "release_workflow_identity": "https://github.com/appolon1908-hue/Middleware-/.github/workflows/release.yml@refs/heads/main",
              "release_oidc_issuer": "https://token.actions.githubusercontent.com",
              "release_manifest_schema_version": "1.0",
              "release_manifest_verification": "PASS_IN_SIGNED_RELEASE_WORKFLOW",
              "signed_release_artifact_sha256": "sha256:13ec5eb0c4a8e26cc342639f4ff5408d81f3de2b0cfefa80c455e65f14f9fbf6",
              "sbom_sha256": "sha256:762846774ffe14edabbd62ce611b5039dbf8394fd21393145e0a7f35ad7275cb",
              "vulnerability_report_sha256": "sha256:3702cbaa225530d52e82f75b0f07d6449d2253cdcdbe573962e5620eb5fea4fb",
              "image_signature": "sigstore-keyless",
              "manifest_signature": "sigstore-keyless-bundle",
              "transparency_log_required": True,
              "vulnerability_policy": "fail-high-or-critical-with-fix",
              "platforms": ["linux/amd64"],
              "schema_or_migration_head": "0003_immutable_event_ledger",
              "external_effects_default": "disabled",
          }
          for key, value in expected.items(): assert source[key] == value, (key, source.get(key), value)
          hash_keys = ("immutable_image_digest", "signed_release_artifact_sha256", "sbom_sha256", "vulnerability_report_sha256")
          assert all(re.fullmatch(r"sha256:[0-9a-f]{64}", source[key]) for key in hash_keys)
          declared = data["private_endpoints"]
          allowed = {
              ("GET", "/metrics", "monitoring-readonly", "metrics.read", False),
              ("GET", "/v1/runtime/safety", "monitoring-readonly", "health.read", False),
          }
          actual = {(item["method"], item["path"], item["client_id"], item["scope"], item["public_exposure"]) for item in declared}
          assert len(declared) == len(allowed)
          assert actual == allowed
          assert all(item["method"] == "GET" and item["client_id"] == "monitoring-readonly" and item["public_exposure"] is False for item in declared)
          credentials = data["staging_credentials"]
          assert credentials["storage"] == "OUTSIDE_GIT"
          assert credentials["static_tokens_allowed"] is False
          assert credentials["secret_values_committed"] is False
          assert 60 <= credentials["minimum_token_ttl_seconds"] <= credentials["maximum_token_ttl_seconds"] <= 900
          evidence = data["staging_evidence"]
          assert evidence["collector_repository"] == "appolon1908-hue/Codestra-Prometheus"
          assert evidence["collector_branch"] == "development"
          assert evidence["collector_source_sha"] == "c41d50bf579d39021c2f81114dd6ad358c483b83"
          assert evidence["collector_workflow_path"] == ".github/workflows/stage6-intake-observability.yml"
          assert evidence["collector_event"] == "workflow_dispatch"
          assert evidence["evidence_schema_version"] == "1.2"
          assert evidence["minimum_soak_seconds"] >= 900
          assert evidence["checksum"] is None and evidence["state"] == "PENDING_RUNTIME_EXECUTION"
          assert {"signed_release_manifest", "sigstore_identity"}.issubset(evidence["must_verify"])
          policy = data["activation_policy"]
          assert policy["prometheus_target_current_state"] == "pending"
          assert policy["prometheus_target_allowed_next_state"] == "active"
          assert policy["only_prometheus_target_may_transition"] is True
          assert policy["prometheus_activation_pr_required"] is True
          assert policy["prometheus_activation_pr_must_cite_image_digest"] is True
          assert policy["prometheus_activation_pr_must_cite_evidence_checksum"] is True
          assert policy["blackbox_target_current_state"] == "pending"
          assert policy["blackbox_must_remain_pending"] is True
          assert policy["blackbox_activation_requires_independent_review"] is True
          assert policy["blackbox_probe_must_be_side_effect_free"] is True
          assert policy["blackbox_allowed_methods"] == ["GET", "HEAD"]
          if data["component"] == "blackbox_exporter": assert policy["blackbox_allowed_status"] == "PENDING_ONLY"
          assert policy["production_activation_authorized"] is False
          assert all(value is False for value in data["runtime_effects"].values())
          print("CONTROLLED_STAGING_IMMUTABLE_DIGEST_LOCK=PASS")
          PY

  verify-execution-evidence-inputs:
    if: github.event_name == 'workflow_dispatch'
    needs: validate-preparation-contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXECUTION_REASON: ${{ inputs.execution_reason }}
      CHANGE_ID: ${{ inputs.change_id }}
      EXPECTED_BRANCH_HEAD: ${{ inputs.expected_branch_head }}
      MIDDLEWARE_IMAGE_DIGEST: ${{ inputs.middleware_image_digest }}
      STAGING_EVIDENCE_CHECKSUM: ${{ inputs.staging_evidence_checksum }}
      STAGING_EVIDENCE_RUN_ID: ${{ inputs.staging_evidence_run_id }}
      STAGING_EVIDENCE_ARTIFACT_NAME: ${{ inputs.staging_evidence_artifact_name }}
      CONFIRM_PROMETHEUS_ONLY: ${{ inputs.confirm_prometheus_only }}
      CONFIRM_BLACKBOX_PENDING: ${{ inputs.confirm_blackbox_pending }}
      CONFIRM_NO_EXTERNAL_EFFECTS: ${{ inputs.confirm_no_external_effects }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Download exact successful Prometheus evidence artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          [[ "$STAGING_EVIDENCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          test -n "$STAGING_EVIDENCE_ARTIFACT_NAME"
          readonly evidence_repository="appolon1908-hue/Codestra-Prometheus"
          run_json="$(gh api "repos/$evidence_repository/actions/runs/$STAGING_EVIDENCE_RUN_ID")"
          test "$(jq -r '.status' <<<"$run_json")" = completed
          test "$(jq -r '.conclusion' <<<"$run_json")" = success
          test "$(jq -r '.event' <<<"$run_json")" = workflow_dispatch
          test "$(jq -r '.head_branch' <<<"$run_json")" = development
          test "$(jq -r '.head_sha' <<<"$run_json")" = c41d50bf579d39021c2f81114dd6ad358c483b83
          test "$(jq -r '.path' <<<"$run_json")" = .github/workflows/stage6-intake-observability.yml
          test "$(jq -r '.repository.full_name' <<<"$run_json")" = "$evidence_repository"
          printf '%s\n' "$run_json" > /tmp/evidence-run.json
          gh api --paginate \
            "repos/$evidence_repository/actions/runs/$STAGING_EVIDENCE_RUN_ID/artifacts?per_page=100" \
            --jq '.artifacts[]' | jq -s '{artifacts: .}' \
            > /tmp/evidence-artifacts.json
          ARTIFACT_NAME="$STAGING_EVIDENCE_ARTIFACT_NAME" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          document = json.loads(Path('/tmp/evidence-artifacts.json').read_text())
          artifacts = document.get('artifacts', [])
          matches = [
              item for item in artifacts
              if item.get('name') == os.environ['ARTIFACT_NAME']
              and item.get('expired') is False
          ]
          if len(matches) != 1:
              raise SystemExit('exact unexpired Prometheus evidence artifact was not found')
          PY
          rm -rf staging-evidence-artifact
          mkdir -p staging-evidence-artifact
          gh run download "$STAGING_EVIDENCE_RUN_ID" \
            --repo "$evidence_repository" \
            --name "$STAGING_EVIDENCE_ARTIFACT_NAME" \
            --dir staging-evidence-artifact
      - name: Verify runtime evidence references and content
        run: |
          python3 - <<'PY'
          import hashlib
          import json, os, re, subprocess
          from pathlib import Path
          reason = " ".join(os.environ["EXECUTION_REASON"].split())
          if len(reason) < 40: raise SystemExit("execution_reason must explain the operational need")
          if not re.fullmatch(r"CHG-[A-Z0-9][A-Z0-9._-]{7,}", os.environ["CHANGE_ID"].strip().upper()): raise SystemExit("change_id must use CHG-* format")
          expected_head = os.environ["EXPECTED_BRANCH_HEAD"].strip().lower()
          actual_head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if not re.fullmatch(r"[0-9a-f]{40}", expected_head) or actual_head != expected_head: raise SystemExit("exact-head validation failed")
          contract = json.loads(Path("integration/staging-activation-contract-v1.json").read_text())
          source = contract["middleware_source_authority"]
          evidence_contract = contract["staging_evidence"]
          collector_run = json.loads(Path("/tmp/evidence-run.json").read_text())
          image = os.environ["MIDDLEWARE_IMAGE_DIGEST"].strip().lower()
          evidence = os.environ["STAGING_EVIDENCE_CHECKSUM"].strip().lower()
          pattern = r"sha256:[0-9a-f]{64}"
          if not re.fullmatch(pattern, image) or image != source["immutable_image_digest"]: raise SystemExit("image digest must exactly match the contract lock")
          if not re.fullmatch(pattern, evidence): raise SystemExit("runtime evidence checksum must use sha256:<64 lowercase hex>")
          forbidden_evidence = {source["immutable_image_digest"], source["signed_release_artifact_sha256"], source["sbom_sha256"], source["vulnerability_report_sha256"]}
          if evidence in forbidden_evidence: raise SystemExit("runtime evidence must differ from every release or image checksum")
          artifact_root = Path("staging-evidence-artifact")
          candidates = []
          for candidate in artifact_root.rglob("*.json"):
              try:
                  document = json.loads(candidate.read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError):
                  continue
              if isinstance(document, dict) and document.get("suite_id") == "codestra-controlled-intake-monitoring-v1":
                  candidates.append((candidate, document))
          if len(candidates) != 1:
              raise SystemExit("artifact must contain exactly one controlled-intake evidence document")
          evidence_path, evidence_document = candidates[0]
          computed = "sha256:" + hashlib.sha256(evidence_path.read_bytes()).hexdigest()
          if computed != evidence:
              raise SystemExit("runtime evidence checksum does not match downloaded artifact")
          checksum_files = list(artifact_root.rglob("*.sha256"))
          if len(checksum_files) != 1 or checksum_files[0].read_text(encoding="utf-8").strip().lower() != computed:
              raise SystemExit("artifact checksum file does not match the evidence document")
          if evidence_document.get("schema_version") != evidence_contract["evidence_schema_version"]:
              raise SystemExit("runtime evidence schema is not supported")
          if evidence_document.get("overall_result") != "PASS" or evidence_document.get("environment") != "staging":
              raise SystemExit("runtime evidence is not a passing staging result")
          target = evidence_document.get("target", {})
          if target.get("private_network_only") is not True or target.get("methods_used") != ["GET"] or target.get("business_writes_performed") is not False:
              raise SystemExit("runtime evidence target boundary is unsafe")
          release = evidence_document.get("middleware_release", {})
          if release.get("source_sha") != source["source_sha"] or release.get("image_digest") != image:
              raise SystemExit("runtime evidence release identity does not match the contract lock")
          collector = evidence_document.get("collector", {})
          expected_collector = {
              "repository": evidence_contract["collector_repository"],
              "branch": evidence_contract["collector_branch"],
              "workflow_path": evidence_contract["collector_workflow_path"],
              "event": evidence_contract["collector_event"],
              "source_sha": evidence_contract["collector_source_sha"],
              "run_id": int(os.environ["STAGING_EVIDENCE_RUN_ID"]),
          }
          if collector != expected_collector:
              raise SystemExit("runtime evidence is not bound to the approved collector run")
          if collector_run["head_sha"] != evidence_contract["collector_source_sha"]:
              raise SystemExit("collector run does not use the approved immutable source SHA")
          claims = evidence_document.get("verification_claims")
          required_claims = set(evidence_contract["must_verify"])
          if not isinstance(claims, dict) or set(claims) != required_claims or any(value != "PASS" for value in claims.values()):
              raise SystemExit("runtime evidence does not pass every required verification claim")
          release_verification = evidence_document.get("release_verification", {})
          if release_verification != {
              "signed_release_manifest": "PASS",
              "sigstore_identity": source["release_workflow_identity"],
              "oidc_issuer": source["release_oidc_issuer"],
              "image_signature": "PASS",
          }:
              raise SystemExit("runtime evidence does not prove the signed release authority")
          checks = evidence_document.get("checks", {})
          if checks.get("unauthenticated_metrics_denied") is not True or checks.get("wrong_token_metrics_denied") is not True:
              raise SystemExit("runtime evidence does not prove fail-closed metrics authentication")
          if checks.get("authenticated_metrics_scrapes") != 2 or checks.get("runtime_safety") != "PASS":
              raise SystemExit("runtime evidence does not contain required scrapes and safety checks")
          token_evidence = evidence_document.get("token_evidence", {})
          if token_evidence.get("metrics", {}).get("scopes") != ["metrics.read"] or token_evidence.get("health", {}).get("scopes") != ["health.read"]:
              raise SystemExit("runtime evidence does not prove exact metrics and health scopes")
          if token_evidence.get("scope_isolation", {}).get("cross_scope_access_denied") is not True:
              raise SystemExit("runtime evidence does not prove cross-scope denial")
          scrapes = evidence_document.get("metrics", {}).get("scrapes")
          if not isinstance(scrapes, list) or len(scrapes) != 2:
              raise SystemExit("runtime evidence must contain exactly two metric scrapes")
          for scrape in scrapes:
              if scrape.get("missing_metric_families") != [] or scrape.get("series_count", 0) <= 0:
                  raise SystemExit("runtime evidence contains an incomplete metric scrape")
              required_families = set(scrape.get("required_metric_families", []))
              sampled_families = set(scrape.get("sampled_metric_families", []))
              if not required_families or not required_families.issubset(sampled_families):
                  raise SystemExit("runtime evidence does not sample every required metric family")
          metrics = evidence_document["metrics"]
          cardinality = metrics.get("cardinality_budget", {})
          maximum_total = cardinality.get("maximum_total_series")
          maximum_family = cardinality.get("maximum_series_per_family")
          if not isinstance(maximum_total, int) or maximum_total <= 0 or not isinstance(maximum_family, int) or maximum_family <= 0:
              raise SystemExit("runtime evidence cardinality budget is invalid")
          if any(scrape["series_count"] > maximum_total or any(count > maximum_family for count in scrape.get("series_by_family", {}).values()) for scrape in scrapes):
              raise SystemExit("runtime evidence exceeds its cardinality budget")
          if metrics.get("forbidden_label_findings") != [] or metrics.get("pii_or_secret_findings") != []:
              raise SystemExit("runtime evidence contains forbidden labels, PII, or secrets")
          safety = evidence_document.get("runtime_safety", {})
          for key in ("provider_effects_disabled", "all_external_effects_disabled", "staging_safe"):
              if safety.get(key) is not True:
                  raise SystemExit(f"runtime safety evidence is false: {key}")
          expected_activation = {"prometheus_target_state": "pending", "blackbox_target_state": "pending", "production_authorized": False}
          if evidence_document.get("activation") != expected_activation:
              raise SystemExit("runtime evidence activation boundary is invalid")
          soak = evidence_document.get("staging_soak", {})
          if soak.get("result") != "PASS" or soak.get("duration_seconds", 0) < evidence_contract["minimum_soak_seconds"] or soak.get("sample_count", 0) < 2:
              raise SystemExit("runtime evidence does not contain the required staging soak")
          rollback = evidence_document.get("rollback_proof", {})
          if rollback.get("result") != "PASS" or rollback.get("state_restored") is not True or rollback.get("external_effects") is not False:
              raise SystemExit("runtime evidence does not contain a safe rollback proof")
          for name in ("CONFIRM_PROMETHEUS_ONLY", "CONFIRM_BLACKBOX_PENDING", "CONFIRM_NO_EXTERNAL_EFFECTS"):
              if os.environ[name].lower() != "true": raise SystemExit(f"{name.lower()} confirmation is required")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## Controlled staging evidence references\n")
              summary.write(f"- Why executed: {reason}\n- Exact head: `{actual_head}`\n")
              summary.write(f"- Locked Middleware image: `{image}`\n- Runtime evidence: `{evidence}`\n")
              summary.write(f"- Evidence run: `{os.environ['STAGING_EVIDENCE_RUN_ID']}`\n- Evidence artifact: `{os.environ['STAGING_EVIDENCE_ARTIFACT_NAME']}`\n")
              summary.write("- Prometheus activation: **separate PR required**\n- Blackbox: **pending**\n- Deployment by this workflow: **No**\n")
          print("CONTROLLED_STAGING_EVIDENCE_REFERENCES=PASS")
          PY
