name: Validate Codestra UI access

on:
  pull_request:
    paths:
      - "config/ui-access.v1.json"
      - "docs/CODESTRA-SECRETS-AUTHORITY.md"
      - "scripts/validate_ui_access.py"
      - ".github/workflows/validate-ui-access.yml"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - run: python scripts/validate_ui_access.py
