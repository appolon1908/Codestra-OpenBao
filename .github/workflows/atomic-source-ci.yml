name: OpenBao atomic source CI

on:
  push:
    branches: [atomic/ob-15-cicd--04-promotion--pr109-reconcile-20261016]

permissions:
  contents: read

concurrency:
  group: openbao-atomic-source-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: OpenBao atomic / validation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact source
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Install pinned parser
        run: python -m pip install --disable-pip-version-check --no-cache-dir PyYAML==6.0.3
      - name: Run source, configuration and regression checks
        run: scripts/validate.sh

  integration:
    name: OpenBao atomic / isolated integration
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact source
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Run integration against an isolated test container
        run: scripts/integration_test.sh

  security:
    name: OpenBao atomic / source security
    needs: integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact source
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install checksum-verified scanner
        run: scripts/install_ci_tools.sh gitleaks
      - name: Run source, history, stored vulnerability and checksum checks
        run: scripts/security.sh

  source-artifacts:
    name: OpenBao atomic / isolated artifact security
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      EXPECTED_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact source
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.10'
          cache: false
      - name: Install checksum-verified scanner and SBOM tools
        run: scripts/install_ci_tools.sh syft trivy
      - name: Build isolated candidates and collect both raw scans
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/openbao-candidate-evidence
        run: bash scripts/validate_source_artifacts.sh
      - name: Validate exact candidate identity and vulnerability policy
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/openbao-candidate-evidence
        if: ${{ always() }}
        run: |
          python3 scripts/collect_openbao_candidate_evidence.py \
            --evidence-dir "$EVIDENCE_DIR" \
            --source-sha "$GITHUB_SHA" \
            --source-tree "$(git rev-parse 'HEAD^{tree}')" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Preserve candidate evidence including failed policy results
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: openbao-candidate-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/openbao-candidate-evidence
          if-no-files-found: error
          retention-days: 30
