name: OpenBao atomic source CI

on:
  pull_request:
  push:
    branches: [atomic/ob-15-cicd--04-promotion--pr109-reconcile-20261016]

permissions:
  contents: read

env:
  EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}

concurrency:
  group: openbao-atomic-source-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: OpenBao atomic / validation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact source
        run: |
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Check committed source diff
        run: |
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              git cat-file -e "$BASE_SHA^{commit}"
              comparison_sha="$BASE_SHA"
              ;;
            push)
              if [[ "$BASE_SHA" == 0000000000000000000000000000000000000000 ]]; then
                comparison_sha="$(git hash-object -t tree /dev/null)"
              else
                git cat-file -e "$BASE_SHA^{commit}"
                comparison_sha="$BASE_SHA"
              fi
              ;;
            *)
              echo "Unsupported source validation event" >&2
              exit 1
              ;;
          esac
          git diff --check "$comparison_sha" "$EXPECTED_SHA" --
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Install pinned parser
        run: python -m pip install --disable-pip-version-check --no-cache-dir PyYAML==6.0.3
      - name: Run source, configuration and regression checks
        run: scripts/validate.sh

  integration:
    name: OpenBao atomic / isolated integration
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact source
        run: |
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Run integration against an isolated test container
        run: scripts/integration_test.sh

  security:
    name: OpenBao atomic / source security
    needs: integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact source
        run: |
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Install checksum-verified scanner
        run: scripts/install_ci_tools.sh gitleaks
      - name: Run source, history, stored vulnerability and checksum checks
        run: scripts/security.sh

  source-artifacts:
    name: OpenBao atomic / isolated artifact security
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact source
        run: |
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.10'
          cache: false
      - name: Install checksum-verified scanner and SBOM tools
        run: scripts/install_ci_tools.sh syft trivy
      - name: Build isolated candidates and collect both raw scans
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/openbao-candidate-evidence
        run: bash scripts/validate_source_artifacts.sh
      - name: Validate exact candidate identity and vulnerability policy
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/openbao-candidate-evidence
        if: ${{ always() }}
        run: |
          python3 scripts/collect_openbao_candidate_evidence.py \
            --evidence-dir "$EVIDENCE_DIR" \
            --source-sha "$EXPECTED_SHA" \
            --source-tree "$(git rev-parse 'HEAD^{tree}')" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Preserve candidate evidence including failed policy results
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: openbao-candidate-${{ env.EXPECTED_SHA }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/openbao-candidate-evidence
          if-no-files-found: error
          retention-days: 30
